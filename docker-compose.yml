version: '3.8'

services:
  # Servicio principal de la aplicación
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayllu_app
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
    command: python -m bot.main
    depends_on:
      - db
      
  # Servicio de Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: ayllu_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayllu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayllu_password}
      POSTGRES_DB: ${POSTGRES_DB:-ayllu_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: