services:
  # Servicio principal de la aplicación
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayllu_app
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
    command: python -m bot.main
    environment:
      SANDBOX_URL: http://sandbox:8000
    networks:
      - default
      - sandbox_net
    depends_on:
      - db
      - sandbox

  # Sandbox de ejecución de código: sin volumen del proyecto, sin .env y sin internet
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: ayllu_sandbox
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    networks:
      - sandbox_net
      
  # Servicio de Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: ayllu_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayllu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayllu_password}
      POSTGRES_DB: ${POSTGRES_DB:-ayllu_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  # internal: true => los contenedores de esta red no tienen salida a internet
  sandbox_net:
    internal: true

volumes:
  postgres_data: